apiVersion: batch/v1
kind: Job
metadata:
  name: validate-shards
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: validator
        image: q3-validator:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
