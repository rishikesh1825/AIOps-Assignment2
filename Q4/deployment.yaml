apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spam-api
  template:
    metadata:
      labels:
        app: spam-api
    spec:
      containers:
      - name: api
        image: spam-api:v1
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "0.5"
          limits:
            cpu: "0.5"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spam-api-service
spec:
  selector:
    app: spam-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
